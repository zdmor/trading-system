# 扫描器运行时配置
# ============================================================

# API 地址
api:
  sina_hq: "http://money.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData"
  tencent_kline: "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param={code},day,,,350,qfq"

# 数据获取
fetch:
  max_pages: 80         # 新浪行情翻页数
  page_size: 100        # 每页股票数
  thread_pool: 15       # 并发线程数
  request_timeout: 10   # HTTP 超时（秒，若 Sina 失效 45s 内自动 fallback 到 AKShare）

# 流动性过滤
filter:
  min_amount: 500000000  # 最低成交额（默认5亿）
  # 可通过命令行参数覆盖

# 分析
analysis:
  max_stocks: 80        # 最多分析多少只
  stock_interval: 0.02  # 个股分析间隔（秒，防限流）
  financial_batch_size: 10    # 基本面补充批次大小
  financial_interval: 0.3     # 基本面请求间隔（秒，防限流）
  quality_batch_size: 30      # 个股质地检查（第三层过滤）最大数量

# 板块景气度五维评分
sector_heat:
  enabled: true
  cache_ttl_minutes: 60
  dimensions:
    policy_weight: 0.15
    capital_flow_weight: 0.25
    strength_weight: 0.25
    valuation_weight: 0.15
    technical_weight: 0.20

# 仓位决策矩阵
position_matrix:
  enabled: true
  thresholds:
    market_bull: 65
    market_bear: 35
    sector_strong: 70
    sector_weak: 35

# 深度研究个股
research_tracker:
  enabled: true
  score_bonus: 10
  display_marker: "R"

# 行业分类
industry:
  cache_file: "industry_cache.json"
  use_akshare: true

# 自选股池（四层漏斗第二/三层结果 + 持仓）
watchlist:
  pool:                     # 关注池
    - code: "600309"        # 万华化学 — 多头吸筹期，评分51.7
    - code: "000651"        # 格力电器 — 空头回避
    - code: "600415"        # 小商品城
    - code: "002714"        # 牧原股份 — 空头回避
    - code: "000988"        # 华工科技
    - code: "002648"        # 卫星化学
    - code: "000920"        # 沃顿科技
    - code: "300976"        # 达瑞电子
    - code: "002709"        # 天赐材料
    - code: "603713"        # 密尔克卫
    - code: "600968"        # 海油发展
    - code: "603871"        # 嘉友国际
    - code: "603993"        # 洛阳钼业
    - code: "300750"        # 宁德时代
    - code: "300308"        # 中际旭创
    - code: "600580"        # 卧龙电驱
    - code: "600285"        # 羚锐制药（原"锐羚制药"）
    - code: "688603"        # 天承科技
    - code: "605099"        # 共创草坪
    - code: "300274"        # 阳光电源
    - code: "300628"        # 亿联网络
    - code: "002158"        # 汉钟精机
    - code: "600529"        # 山东药玻
    - code: "688120"        # 华海清科
  holdings:                 # 持仓
    - code: "002050"        # 三花智控 成本51.44×100 多头筑底
      cost: 51.44
      shares: 100
    - code: "600038"        # 中直股份 成本35.37×300 浮亏19%
      cost: 35.37
      shares: 300
    - code: "600011"        # 华能国际 成本9.60×500 三周期全多
      cost: 9.60
      shares: 500

# 输出
report:
  top_n_default: 15

# 推送通知
notify:
  pushplus_token: ""
  serverchan_key: ""
  webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/80bc88c5-263c-4155-8907-e68d58d293f6"
  # 三选一（优先顺序: pushplus > serverchan > webhook）:
  #   pushplus_token: 推送到微信（推荐，最简单）
  #     获取: https://www.pushplus.plus 微信扫码 -> 复制 token
  #   serverchan_key: ServerChan 微信推送（备选）
  #     获取: https://sct.ftqq.com 微信扫码 -> SendKey
  #   webhook_url: 推送到飞书群
  #     获取: 飞书群 -> 设置 -> 群机器人 -> Webhook机器人
